# Complexity thresholds for the quality gate (tools/quality_gate.sh step 2).
#
# Calibrated against this codebase on 2026-09-17, not copied from a template.
# Measured state at that point: 5 functions over the cognitive-complexity
# threshold, 1 over the argument count, 1 over type complexity.

# Cognitive complexity is the cyclomatic-complexity stand-in that actually fits
# an interpreter. It scores *branching and nesting*, so a flat 800-line opcode
# `match` -- which is a decode table, not tangled logic -- barely registers,
# while genuinely knotted control flow does. That distinction is why this gate
# uses it and deliberately does NOT enable `clippy::too_many_lines`: function
# length here is dominated by decode tables (the largest is 863 lines), and
# gating on length would only pressure people into splitting tables for no gain.
cognitive-complexity-threshold = 25

# `draw_line_impl` (vdp.rs) currently takes 11. Rasterizer inner loops do
# accumulate parameters, but 11 positional arguments is the same failure mode as
# the 17-element anonymous tuple flagged in the VDP2 review -- a struct is the
# fix, not a raised threshold.
too-many-arguments-threshold = 7

# `m68k.rs`'s TRACE_RING is `Mutex<Vec<(u32, u16, u32, u32, u32)>>`; a named
# type would say what the five fields mean.
type-complexity-threshold = 250
