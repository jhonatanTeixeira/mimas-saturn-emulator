<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Diagrama mostrando o caminho de um setor de CD-ROM desde os registradores de comando, passando pelos 24 filtros seletores, pelo buffer de partição, pela porta de dados DTR, até ser transferido via DMA da SCU para a Work RAM.</desc>
