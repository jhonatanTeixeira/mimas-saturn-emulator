<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Diagrama mostrando um Mediator roteando mensagens para três workers isolados — vídeo, som e lógica — cada um com seu próprio buffer Arc RwLock dedicado, evitando que uma trava de memória bloqueie subsistemas não relacionados.</desc>
